<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101428"><meta name="description" content="행운의 룰렛 - 럭키 플레이"><title>행운의 룰렛 | LUCKY PLAY</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');:root{color-scheme:dark;--bg:#101428;--surface:#1d233be8;--muted:#acb8d6;--a:#af94ff;--b:#68e9df}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f8f8ff;font-family:'Noto Sans KR',sans-serif;background:radial-gradient(ellipse at 85% 4%,#4b3e8180,transparent 45%),radial-gradient(ellipse at 5% 88%,#11596275,transparent 48%),#101428}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1200px;margin:auto;padding:0 16px}.bar{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:900;text-decoration:none;color:white;white-space:nowrap}.spark{background:linear-gradient(130deg,var(--a),var(--b));padding:5px 12px;border-radius:12px;color:#101428;margin-right:9px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav a{color:#d8dcf4;text-decoration:none;border:1px solid #777d9b;border-radius:10px;padding:9px 12px;font-size:12px}.nav a.active{background:#5e5086;border-color:#a28dd1}h1{text-align:center;font-size:clamp(32px,5.4vw,58px);letter-spacing:-.065em;margin:22px 0 8px;line-height:1.35}.shine{background:linear-gradient(90deg,#b5a0ff,#6ce7e4);color:transparent;background-clip:text}.lead{text-align:center;color:var(--muted);font-size:14px;margin:0 0 34px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}.panel{background:var(--surface);border:1px solid #ffffff22;border-radius:22px;padding:23px;box-shadow:0 12px 35px #02071540}h2{margin:0 0 21px;font-size:18px}.field{margin-bottom:20px}.field>label{font-size:13px;color:#d2d7f4;font-weight:800;display:block;margin-bottom:10px}.step{display:flex;align-items:center;justify-content:space-between;background:#10182c;border:1px solid #56607f;border-radius:13px;padding:5px}.step button{border:0;background:#343b59;color:white;border-radius:9px;width:40px;height:39px;font-size:22px}.step strong{font-size:19px}.tabs{display:flex;background:#10162c;border-radius:12px;padding:4px;gap:4px}.tabs button{flex:1;border:0;border-radius:10px;background:transparent;color:#abb5d6;font-size:12px;padding:10px 4px}.tabs button.active{background:#564d81;color:white;font-weight:800}.names{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:220px;overflow:auto;margin-top:12px}.names input{width:100%;min-width:0;border:1px solid #536080;border-radius:9px;background:#11182e;padding:9px;color:white;font-size:12px}.hint{font-size:12px;line-height:1.75;color:#a4afcb}.primary{background:linear-gradient(105deg,#a98fff,#65e5dc);color:#11162c;font-weight:900;border:0;border-radius:13px;padding:13px 18px}.ghost{border:1px solid #697395;background:#303855;color:#f3f3ff;font-weight:800;border-radius:12px;padding:12px 15px}.full{width:100%}.second{margin-top:10px}.board{min-height:580px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h2{margin:0}.pill{font-size:12px;color:#8ef0dc;background:#22544a;border-radius:22px;padding:7px 11px}.subtitle{color:#aebad6;font-size:13px;margin:11px 0 20px}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px}.notice{text-align:center;color:#b9c5df;font-size:13px;margin-top:17px;min-height:22px}.result{display:none;margin-top:16px;background:linear-gradient(105deg,#483676,#1d5659);border-radius:14px;padding:17px;overflow-wrap:anywhere}.result.show{display:block}.result strong{font-size:18px}.result p{font-size:13px;color:#e4e5f4;margin:7px 0 0}footer{text-align:center;color:#8994b7;font-size:12px;padding:38px 0}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;width:9px;height:16px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(820deg);opacity:0}}@media(max-width:900px){.bar{align-items:flex-start;padding-top:17px;flex-direction:column}.nav{margin-bottom:12px}.layout{grid-template-columns:1fr}.board{min-height:0}}@media(max-width:480px){.panel{padding:15px}.nav a{padding:7px;font-size:10px}.actions button{flex:1}.brand{font-size:19px}}@media(prefers-reduced-motion:reduce){.confetti{display:none}}</style></head><body><div class="wrap"><header class="bar"><a class="brand" href="../"><span class="spark">✳</span>LUCKY PLAY</a><nav class="nav" aria-label="게임 메뉴"><a href="../">🪜 사다리</a><a href="../draw/">🎁 뽑기</a><a href="../roulette/" class="active" aria-current="page">🎡 룰렛</a><a href="../lots/" >🎫 제비뽑기</a></nav></header><h1>행운의 <span class="shine">룰렛</span></h1><p class="lead">빙글빙글 돌려서 중복 없이 당첨자를 뽑아보세요!</p><main class="layout"><aside class="panel"><h2>⚙️ 게임 설정</h2><div class="field"><label>01 · 참여 인원</label><div class="step"><button id="pm" aria-label="인원 줄이기">−</button><strong id="people">6명</strong><button id="pp" aria-label="인원 늘리기">+</button></div></div><div class="field"><label>02 · 당첨 인원</label><div class="step"><button id="wm" aria-label="당첨 인원 줄이기">−</button><strong id="winners">2명</strong><button id="wp" aria-label="당첨 인원 늘리기">+</button></div><p class="hint">당첨자는 중복 없이 정확히 설정한 인원만 뽑힙니다.</p></div><div class="field"><label>03 · 참여 방식</label><div class="tabs"><button id="numbers" class="active" aria-pressed="true">🔢 번호 선택</button><button id="named" aria-pressed="false">✏️ 이름 입력</button></div><div id="inputs" class="names" hidden></div></div><button id="new" class="primary full">✨ 새로운 게임 만들기</button><button id="reset" class="ghost full second">↻ 설정 초기화</button><p class="hint">별도의 로그인이나 서버 저장 없이 브라우저에서 무작위 추첨합니다.</p></aside><section class="panel board"><div class="top"><h2>✨ 행운의 순간</h2><span class="pill" id="status">● 준비 완료</span></div><p class="subtitle" id="subtitle">빙글빙글 돌려서 중복 없이 당첨자를 뽑아보세요!</p><style>.wheel-wrap{position:relative;width:min(100%,480px);aspect-ratio:1;margin:6px auto 18px}.wheel-wrap canvas{width:100%;height:100%;display:block;border-radius:50%;filter:drop-shadow(0 15px 18px #04081b80);transition:transform 5.2s cubic-bezier(.1,.7,.14,1)}.pointer{position:absolute;z-index:2;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:35px solid #fff7d3;filter:drop-shadow(0 3px 3px #0008)}.center{pointer-events:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;width:65px;height:65px;display:flex;align-items:center;justify-content:center;background:#f9f3ff;border:8px solid #242946;color:#483472;font-weight:900;font-size:11px;box-shadow:0 3px 12px #0008}.history{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:14px;min-height:24px}.chip{background:#245748;border:1px solid #68d9bb;padding:6px 10px;border-radius:50px;font-size:12px;color:#e8fff8}.remaining{margin:9px auto;text-align:center;color:#d7dbf2;font-size:13px}.actions button{min-width:135px}</style><div class="wheel-wrap"><canvas id="wheel" width="800" height="800" role="img" aria-label="참여자 추첨 룰렛"></canvas><div class="pointer" aria-hidden="true"></div><div class="center">LUCKY</div></div><div class="remaining" id="remain">남은 당첨 2명</div><div class="history" id="history" aria-live="polite"></div><div class="actions"><button id="spin" class="primary">🎡 룰렛 돌리기</button><button id="all" class="ghost">🏆 당첨자 확인</button><button id="shuffle" class="ghost">🔀 다시 시작</button></div><script>(()=>{'use strict';const $=s=>document.getElementById(s);let count=6,winCount=2,mode='number',names=Array(24).fill(''),busy=false;function random(m){const a=new Uint32Array(1),limit=Math.floor(4294967296/m)*m;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%m}function label(i){return mode==='number'?(i+1)+'번':(names[i].trim()||((i+1)+'번'))}function controls(){$('people').textContent=count+'명';$('winners').textContent=winCount+'명';$('numbers').classList.toggle('active',mode==='number');$('named').classList.toggle('active',mode==='name');$('numbers').setAttribute('aria-pressed',String(mode==='number'));$('named').setAttribute('aria-pressed',String(mode==='name'));$('inputs').hidden=mode!=='name';$('inputs').replaceChildren();for(let i=0;i<count;i++){const e=document.createElement('input');e.value=names[i];e.placeholder=(i+1)+'번 이름';e.maxLength=18;e.setAttribute('aria-label',(i+1)+'번 이름');e.addEventListener('input',()=>{names[i]=e.value;refreshLabels()});$('inputs').append(e)}}function result(title,detail,celebrate=false){const box=$('result'),h=document.createElement('strong'),p=document.createElement('p');h.textContent=title;p.textContent=detail;box.replaceChildren(h,p);box.classList.add('show');if(celebrate)confetti()}function confetti(){const box=$('confetti');box.replaceChildren();for(let i=0;i<65;i++){const e=document.createElement('i');e.style.left=random(100)+'%';e.style.animationDelay=random(80)/100+'s';e.style.background=['#ad92ff','#70e6dd','#ffe085','#ff97b7'][random(4)];e.style.setProperty('--dx',(random(240)-120)+'px');box.append(e)}setTimeout(()=>box.replaceChildren(),4000)}function lock(v){busy=v;document.querySelectorAll('button,input').forEach(e=>e.disabled=v)}function change(k,d){if(busy)return;if(k==='count'){count=Math.max(2,Math.min(24,count+d));winCount=Math.min(count,winCount)}else winCount=Math.max(1,Math.min(count,winCount+d));controls();newGame()}function bindCommon(){$('pm').onclick=()=>change('count',-1);$('pp').onclick=()=>change('count',1);$('wm').onclick=()=>change('win',-1);$('wp').onclick=()=>change('win',1);$('numbers').onclick=()=>{if(busy)return;mode='number';controls();newGame()};$('named').onclick=()=>{if(busy)return;mode='name';controls();newGame()};$('new').onclick=()=>{if(!busy)newGame()};$('reset').onclick=()=>{if(busy)return;count=6;winCount=2;mode='number';names=Array(24).fill('');controls();newGame()};controls()};let remaining=[],selected=[],angle=0,revision=0;const colors=['#8d76dd','#4a9b9b','#5b65b1','#b06c9b','#3d8b91','#7c69ad','#4c81b5','#ae7c61'];function drawWheel(){const c=$('wheel'),ctx=c.getContext('2d'),m=remaining.length;if(!m)return;const size=800,center=400,r=380;ctx.clearRect(0,0,size,size);ctx.save();ctx.translate(center,center);for(let k=0;k<m;k++){const a=-Math.PI/2+k*2*Math.PI/m,b=a+2*Math.PI/m;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,b);ctx.closePath();ctx.fillStyle=colors[k%colors.length];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#ece8ff88';ctx.stroke();ctx.save();ctx.rotate(a+Math.PI/m);ctx.translate(r*.65,0);ctx.rotate(Math.PI/2);ctx.fillStyle='#ffffff';ctx.font='bold '+(m>16?19:m>10?24:32)+'px Noto Sans KR, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const str=label(remaining[k]);ctx.fillText(str.length>8?str.slice(0,7)+'…':str,0,0,Math.max(75,(2*Math.PI*r*.65/m)*.94));ctx.restore()}ctx.restore()}function refreshLabels(){drawWheel();refreshWinners()}function refreshWinners(){$('history').replaceChildren();for(const i of selected){const span=document.createElement('span');span.className='chip';span.textContent='🏆 '+label(i);$('history').append(span)}}function stats(){$('remain').textContent='남은 당첨 '+Math.max(0,winCount-selected.length)+'명 · 남은 후보 '+remaining.length+'명';$('spin').disabled=busy||selected.length>=winCount;$('status').textContent=selected.length>=winCount?'● 추첨 완료':'● '+selected.length+' / '+winCount+'명 당첨'}function newGame(){revision++;remaining=Array.from({length:count},(_,i)=>i);selected=[];angle=0;const c=$('wheel');c.style.transition='none';c.style.transform='rotate(0deg)';drawWheel();refreshWinners();$('result').classList.remove('show');$('notice').textContent='룰렛을 돌려 당첨자를 한 명씩 뽑아보세요.';stats()}function spin(){if(busy||selected.length>=winCount||!remaining.length)return;lock(true);const rev=revision,m=remaining.length,k=random(m),target=remaining[k],sector=360/m;const previous=((angle%360)+360)%360;const targetRotation=((360-(k+.5)*sector)%360);const diff=((targetRotation-previous+360)%360)+360*(5+random(3));angle+=diff;const c=$('wheel');c.style.transition='transform 5.2s cubic-bezier(.12,.72,.11,1)';requestAnimationFrame(()=>{requestAnimationFrame(()=>{c.style.transform='rotate('+angle+'deg)'})});$('status').textContent='● 룰렛 회전 중';$('notice').textContent='두근두근... 행운의 주인공을 찾고 있어요!';setTimeout(()=>{if(rev!==revision)return;selected.push(target);remaining.splice(k,1);result('🎉 '+label(target)+' 당첨!',selected.length+' / '+winCount+'명 추첨 완료',true);lock(false);stats();if(selected.length<winCount){$('notice').textContent='다음 당첨자를 뽑으려면 룰렛을 다시 돌려주세요.';/* retain wheel spin result until next round */}else $('notice').textContent='추첨이 모두 끝났습니다!';},5300)}function nextWheel(){if(busy||selected.length>=winCount)return;drawWheel()}$('spin').onclick=()=>{if(!busy){if(selected.length&&remaining.length){const c=$('wheel');c.style.transition='none';c.style.transform='rotate(0deg)';angle=0;drawWheel();void c.offsetWidth}spin()}};$('all').onclick=()=>{if(busy)return;if(!selected.length){$('notice').textContent='아직 당첨자가 없습니다. 룰렛을 먼저 돌려주세요.';return}result('🏆 지금까지 당첨자 '+selected.length+'명',selected.map(label).join(' · '))};$('shuffle').onclick=()=>{if(!busy)newGame()};bindCommon();newGame();})();</script><div id="notice" class="notice" aria-live="polite"></div><div id="result" class="result" aria-live="polite"></div></section></main><footer>LUCKY PLAY · 번호와 이름은 서버에 저장되지 않습니다.</footer></div><div id="confetti" class="confetti" aria-hidden="true"></div></body></html>
